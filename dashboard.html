<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - EVERREACH TECHNOLOGIES</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:system-ui;background:#0f172a;color:white}
.card,.item{background:#1e293b;padding:20px;border-radius:16px}
.card{text-align:center}
#bal{color:#22c55e}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.item{text-align:center}
.item a{color:white;text-decoration:none;display:block}
button{width:100%;padding:14px;background:#ef4444;border:0;border-radius:10px;color:white;font-weight:800;margin-top:20px}
#status{color:#94a3b8;text-align:center}
</style>
</head>
<body>

<div class="card">
<h2 id="hello">Loading your account...</h2>
<p style="color:#94a3b8">Your Wallet Balance</p>
<h1 id="bal">KES 0</h1>
<p id="role"></p>
</div>

<div class="grid">
<div class="item"><br>Games</div>
<div class="item"><br>Paid Surveys</div>
<div class="item"><br>Wallet</div>
<div class="item"><br>Learnings</div>
<div class="item"><br>Community</div>
<div class="item"><br>Articles</div>
</div>

<p id="status">Checking your secure session...</p>
<button id="logout">LOG OUT</button>

<script>
async function loadAccount(){
try{
const response=await fetch("/api/me",{credentials:"include"});
const data=await response.json();

if(!response.ok || !data.authenticated){
window.location.replace("login.html");
return;
}

const user=data.user;
document.getElementById("hello").textContent="Hello, "+user.email;
document.getElementById("role").textContent=
user.role==="admin" ? "Administrator access" : "Member account";

if(user.role === "admin"){
  const button = document.createElement("button");
  button.textContent = "OPEN ADMIN DASHBOARD";
  button.style.background = "#2563eb";
  button.onclick = () => {
    window.location.href = "/admin.html";
  };
  document.querySelector(".card").appendChild(button);
}

document.getElementById("bal").textContent=
"KES "+(localStorage.getItem("everreach_balance")||"0");

document.getElementById("status").textContent="Your account is connected.";
}catch(error){
document.getElementById("status").textContent=
"Cannot connect to the authentication server.";
}
}

document.getElementById("logout").addEventListener("click",async()=>{
try{
await fetch("/api/logout",{
method:"POST",
credentials:"include"
});
}catch(error){}
window.location.replace("login.html");
});

loadAccount();
</script>
</body>
</html>
