<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard - EVERREACH</title>
<style>body{margin:0;font-family:system-ui;background:#0f172a;color:white;padding:20px}.card{background:#1e293b;padding:20px;border-radius:16px;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.item{background:#1e293b;padding:20px;border-radius:14px;text-align:center;font-weight:700}button{width:100%;padding:12px;background:#ef4444;border:none;border-radius:10px;color:white;font-weight:800;margin-top:16px}</style></head>
<body><div class="card"><h2 id="hello">Hello 👋</h2><p style="color:#94a3b8">Your Wallet Balance</p><h1 style="color:#22c55e" id="bal">KES 0</h1></div>
<div class="grid"><div class="item">🎮<br>Games</div><div class="item">📝<br>Paid Surveys</div><div class="item">💰<br>Wallet</div><div class="item">📚<br>Learning</div><div class="item">👥<br>Community</div><div class="item">📰<br>Articles</div></div>
<button onclick="logout()">LOGOUT</button>
<script>let u=JSON.parse(localStorage.getItem('everreach_user')||'null');if(!u){window.location.href='/login.html'}else{document.getElementById('hello').innerText='Hello, '+u.name+' 👋';document.getElementById('bal').innerText='KES '+(localStorage.getItem('everreach_balance')||'0')}function logout(){localStorage.removeItem('everreach_user');window.location.href='/'}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const sb = window.supabase ? window.supabase.createClient('https://ihxmejlwzlmmaqghofoh.supabase.co','sb_publishable_IIyd49_tAKF7H8A8gGeJew_hJVcwLGh') : null;
  function doLogout(e){
    if(e) e.preventDefault();
    localStorage.removeItem('everreach_email');
    localStorage.clear();
    sessionStorage.clear();
    if(sb) sb.auth.signOut().finally(()=>{ window.location.href='login.html'; });
    else window.location.href='login.html';
  }
  document.addEventListener('DOMContentLoaded', ()=>{
    const btns = Array.from(document.querySelectorAll('button, a'));
    const out = btns.find(b=>b.textContent.trim().toUpperCase().includes('LOGOUT') || b.textContent.trim().toUpperCase().includes('LOG OUT'));
    if(out) out.onclick = doLogout;
  });
})();
</script>
</body>
</html>
