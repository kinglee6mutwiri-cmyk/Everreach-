<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>EVERREACH | Welcome Back</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
background:radial-gradient(circle at top right,#29205c 0%,transparent 40%),#080d1c;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
padding:22px;
}
.container{width:100%;max-width:440px}
.logo{text-align:center;margin-bottom:28px}
.logo-mark{
width:58px;height:58px;border-radius:18px;
background:linear-gradient(135deg,#7655ff,#20c5c5);
display:flex;align-items:center;justify-content:center;
font-size:27px;font-weight:900;margin:0 auto 14px;
box-shadow:0 8px 35px #7655ff55;
}
.logo h1{font-size:27px;letter-spacing:3px}
.logo p{font-size:12px;color:#9da8c4;margin-top:8px;letter-spacing:1px}
.card{
background:#111a2e;border:1px solid #293550;
border-radius:23px;padding:32px 25px;
box-shadow:0 25px 80px #0007;
}
.card h2{font-size:25px;margin-bottom:9px}
.subtitle{font-size:14px;color:#9da8c4;margin-bottom:27px;line-height:1.6}
.field{margin-bottom:19px}
.field label{display:block;font-size:13px;color:#dce3f4;margin-bottom:9px}
.field input{
width:100%;padding:15px;
border:1px solid #34415e;border-radius:11px;
background:#0b1324;color:white;font-size:15px;outline:none;
}
.field input:focus{border-color:#8666ff;box-shadow:0 0 0 3px #8666ff22}
.password-wrap{position:relative}
.password-wrap input{padding-right:65px}
.toggle{
position:absolute;right:13px;top:50%;transform:translateY(-50%);
background:none;border:0;color:#a99aff;cursor:pointer;font-size:12px;
}
.forgot{text-align:right;margin-top:-8px;margin-bottom:21px}
.forgot a,.switch a{color:#a995ff;text-decoration:none;font-size:13px}
.btn{
width:100%;padding:15px;border:0;border-radius:11px;
background:linear-gradient(100deg,#7655ff,#5140cf);
color:white;font-size:15px;font-weight:700;cursor:pointer;
}
.btn:disabled{opacity:.6;cursor:wait}
.divider{display:flex;align-items:center;gap:13px;color:#65718b;font-size:12px;margin:24px 0}
.divider:before,.divider:after{content:"";height:1px;background:#303b53;flex:1}
.switch{text-align:center;font-size:13px;color:#a5afc5;margin-top:23px}
.message{display:none;padding:12px;border-radius:9px;font-size:13px;margin-bottom:16px;line-height:1.5}
.error{background:#481d2a;color:#ffb8c5}
.success{background:#123a32;color:#9af0ce}
.footer{text-align:center;color:#69758f;font-size:11px;margin-top:23px;line-height:1.8}
</style>
</head>

<body>
<main class="container">

<div class="logo">
<div class="logo-mark">E</div>
<h1>EVERREACH</h1>
<p>ONE WORLD. ENDLESS OPPORTUNITIES.</p>
</div>

<section class="card">
<h2 id="heading">Welcome Back</h2>
<p class="subtitle" id="description">Sign in to continue your journey with EVERREACH.</p>

<div id="message" class="message"></div>

<form id="authForm">

<div class="field">
<label for="email">Email Address</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
</div>

<div class="field">
<label for="password">Password</label>
<div class="password-wrap">
<input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="8">
<button class="toggle" type="button" id="togglePassword">SHOW</button>
</div>
</div>

<div class="forgot" id="forgot">
<a href="#" id="forgotLink">Forgot password?</a>
</div>

<button class="btn" id="submitBtn" type="submit">Sign In</button>
</form>

<div class="divider">SECURE ACCESS</div>

<div class="switch">
<span id="switchText">New to EVERREACH?</span>
<a href="/signup.html">Create Account</a>
</div>
</section>

<div class="footer">
EVERREACH TECHNOLOGIES<br>
Play. Learn. Earn. Connect. Grow.<br>
© 2026 EVERREACH. All rights reserved.
</div>

</main>

<script>
const form = document.getElementById("authForm");
const password = document.getElementById("password");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

function notify(text,type){
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
}

document.getElementById("togglePassword").onclick = () => {
    const visible = password.type === "password";
    password.type = visible ? "text" : "password";
    document.getElementById("togglePassword").textContent =
        visible ? "HIDE" : "SHOW";
};

document.getElementById("forgotLink").onclick = (event) => {
    event.preventDefault();
    notify(
        "Password recovery will be connected to the secure authentication service in the next step.",
        "error"
    );
};

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass = password.value;

    button.disabled = true;
    button.textContent = "Please wait...";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify({email, password: pass})
        });

        const result = await response.json();

        if (!response.ok) {
            notify(result.error || "Login failed.", "error");
        } else {
            notify("Login successful. Opening your dashboard...", "success");
            window.location.href =
                result.user.role === "admin" ? "/admin.html" : "/dashboard.html";
        }
    } catch (error) {
        notify("Cannot reach EVERREACH. Please try again.", "error");
    } finally {
        button.disabled = false;
        button.textContent = "Sign In";
    }
});
</script>
</body>
</html>
